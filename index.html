<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio | testserver364</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="max-w-5xl mx-auto px-6 py-12 border-b border-slate-800">
    <div class="flex items-center gap-4">
      <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-indigo-500/30">
        TS
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">testserver364</h1>
        <p class="text-sm text-indigo-400 font-medium">Software Engineer & Systems Architect</p>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12 space-y-12">
    <section>
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-code text-indigo-400"></i> Featured Engineering Projects
          </h2>
          <p class="text-xs text-slate-400 mt-1">Automatically curated and synchronized via Portfolio Agent.</p>
        </div>
      </div>
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Projects rendered from data/projects.json -->
      </div>
    </section>
  </main>

  <script>
    async function loadProjects() {
      try {
        const res = await fetch('data/projects.json');
        const projects = await res.json();
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = projects.map(p => `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 hover:border-slate-700 transition flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <h3 class="text-base font-bold text-white">${p.title || p.name}</h3>
                ${p.github ? `<a href="${p.github}" target="_blank" class="text-slate-400 hover:text-white"><i class="fa-brands fa-github"></i></a>` : ''}
              </div>
              <p class="text-xs text-slate-400 leading-relaxed mb-4">${p.description || ''}</p>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-auto">
              ${(p.tags || []).map(t => `<span class="text-[10px] font-mono bg-indigo-950/60 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded">${t}</span>`).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load projects', e);
      }
    }
    loadProjects();
  </script>
</body>
</html>
